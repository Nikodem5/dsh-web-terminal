name: Feature request
description: Suggest a new feature or an improvement to dsh-web-terminal or dsh-code-editor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin
      options:
        - dsh-web-terminal
        - dsh-code-editor
        - both
        - not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem you are trying to solve
      description: Describe the situation, not only the feature
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional
